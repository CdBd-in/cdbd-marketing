<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
  body { margin: 0; padding: 16px; background: #fff; color: #222; font-size: 13px; }
  h2 { margin: 0 0 16px; font-size: 15px; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 12px; color: #444; }
  input[type=text], textarea {
    width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px;
    font-family: inherit;
  }
  textarea { min-height: 80px; resize: vertical; font-family: 'SF Mono', Menlo, monospace; font-size: 12px; }
  button {
    background: #18A0FB; color: #fff; border: 0; padding: 10px 16px; border-radius: 6px;
    font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 16px;
  }
  button:hover { background: #0d8de6; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  .hint { font-size: 11px; color: #888; margin-top: 4px; }
  .preset {
    display: inline-block; background: #f0f0f0; padding: 4px 8px; border-radius: 4px;
    margin: 2px 4px 2px 0; cursor: pointer; font-size: 11px; user-select: none;
  }
  .preset:hover { background: #e0e0e0; }
  #result {
    margin-top: 16px; padding: 12px; background: #f6f6f6; border-radius: 6px;
    font-family: 'SF Mono', Menlo, monospace; font-size: 11px; white-space: pre-wrap;
    max-height: 200px; overflow-y: auto;
  }
  .ok { color: #0a8a3f; }
  .err { color: #c00; }
</style>
</head>
<body>
  <h2>🎨 CdBd 블로그 썸네일 자동 제작</h2>
  <div class="hint" style="margin-bottom:12px;">
    📂 출력: <b>"💻 AI 블로그 썸네일 제작"</b> 페이지 (26:2) · 슬롯 원본은 건드리지 않음
  </div>

  <h3 style="font-size: 13px; margin: 16px 0 8px; color: #333;">🤖 AI 이미지 자동 생성</h3>
  <label>블로그 제목</label>
  <input type="text" id="blogTitle" placeholder="기업이 비공개 초대장을 고집하는 7가지 이유">

  <label>블로그 콘텐츠 (선택)</label>
  <textarea id="blogContent" placeholder="B2B 행사와 세미나에서 초대장의 중요성..." style="min-height: 60px;"></textarea>

  <label>생성 이미지 개수</label>
  <input type="number" id="imageCount" value="10" min="4" max="20" style="width: 80px;">

  <button id="generateImages" style="background:#10b981; margin-top:12px;">🌟 AI 이미지 생성</button>

  <div id="imagePreview" style="display:none; margin-top:16px; padding:12px; background:#f9f9f9; border-radius:6px;">
    <label style="color:#10b981; font-weight:700;">추출된 키워드</label>
    <div id="keywordList" style="margin:8px 0; display:flex; flex-wrap:wrap; gap:4px;"></div>
    <label style="color:#10b981; font-weight:700; margin-top:8px;">이미지 후보</label>
    <div id="imageList" style="margin-top:8px; max-height:150px; overflow-y:auto;"></div>
  </div>

  <hr style="margin:16px 0; border:none; border-top:1px solid #ddd;">

  <h3 style="font-size: 13px; margin: 16px 0 8px; color: #333;">📋 수동 입력</h3>
  <button id="fillExample" style="background:#888; margin-top:0;">📋 A 유형 예시 (목업)</button>
  <button id="fillExampleD" style="background:#888; margin-top:0; margin-left:4px;">📋 D 유형 예시 (3D·초대장)</button>
  <button id="fillExampleE" style="background:#888; margin-top:0; margin-left:4px;">📋 E 유형 예시 (배경·리스티클)</button>

  <label>타이틀 (줄바꿈은 \n)</label>
  <textarea id="title" placeholder="전 세계 파트너를 사로잡는\nCdBd 모바일 명함"></textarea>

  <label>서브타이틀 (없으면 비움 / 줄바꿈은 \n)</label>
  <input type="text" id="subtitle" placeholder="언어 장벽 없는\n글로벌 네트워킹">

  <label>강조어 (타이틀 안에 있는 문구)</label>
  <input type="text" id="emphasis" placeholder="CdBd 모바일 명함">
  <div class="hint">서브타이틀 있음 → 그린 / 없음 → 퍼플 자동 적용</div>

  <label>변형 매트릭스 (JSON 배열)</label>
  <textarea id="variants" placeholder='[
  {"slotId": "1:1269", "imageHash": "1f0dd...", "name": "안1", "mockupId": "75:34"}
]
mockupId: 75:34(원페이지-1, 기본) / 1:1369(원페이지-2) / 1:1370(멀티페이지)
없으면 기본 75:34 사용'></textarea>

  <div class="hint">
    슬롯 ID 빠른 참조:<br>
    <span class="preset" data-id="1:1266">A 목업·상</span>
    <span class="preset" data-id="1:1269">A 목업·상·서</span>
    <span class="preset" data-id="1:1251">A 목업·하</span>
    <span class="preset" data-id="1:1246">A 목업·하·서</span>
    <span class="preset" data-id="1:1300">B 목업+에디터·상</span>
    <span class="preset" data-id="1:1308">B 상·서</span>
    <span class="preset" data-id="1:1304">B 하</span>
    <span class="preset" data-id="1:1314">B 하·서</span>
    <span class="preset" data-id="1:1254">D 3D·상</span>
    <span class="preset" data-id="1:1282">D 상·서</span>
    <span class="preset" data-id="1:1274">D 하</span>
    <span class="preset" data-id="1:1277">D 하·서</span>
    <span class="preset" data-id="1:1257">C 멀티·상</span>
    <span class="preset" data-id="1:1287">C 상·서</span>
    <span class="preset" data-id="1:1262">E 배경·중앙</span>
    <span class="preset" data-id="1:1294">E 중앙·서</span>
  </div>

  <button id="run">4안 자동 제작 ▶</button>

  <div id="result"></div>

<script>
  // AI 이미지 생성 버튼 클릭
  document.getElementById('generateImages').onclick = async () => {
    const blogTitle = document.getElementById('blogTitle').value.trim();
    const blogContent = document.getElementById('blogContent').value.trim();
    const imageCount = parseInt(document.getElementById('imageCount').value) || 10;

    if (!blogTitle) {
      document.getElementById('result').innerHTML = '<span class="err">블로그 제목 필수</span>';
      return;
    }

    document.getElementById('result').textContent = '🔄 이미지 생성 중…';
    parent.postMessage({
      pluginMessage: {
        type: 'generate-images-ai',
        payload: { blogTitle, blogContent, imageCount }
      }
    }, '*');
  };

  // 슬롯 ID 클릭하면 클립보드에 복사
  document.querySelectorAll('.preset').forEach(el => {
    el.onclick = () => {
      navigator.clipboard.writeText(el.dataset.id);
      el.textContent = '복사됨!';
      setTimeout(() => el.textContent = el.dataset.id ? document.querySelector(`[data-id="${el.dataset.id}"]`).textContent : '', 800);
    };
  });

  // 검증 예시 자동 채우기 (1-1 스타일: 의미 단위, 한 줄 ≤8자, 강조어 한 줄 안)
  document.getElementById('fillExample').onclick = () => {
    document.getElementById('title').value = '전 세계 파트너를\\n사로잡는\\nCdBd 모바일 명함';
    // 1-1 §3 줄나누기: 의미 단위로 끊기 (자동 줄바꿈 fallback 의존 X)
    document.getElementById('subtitle').value = '언어 장벽 없는\\n글로벌 네트워킹';
    document.getElementById('emphasis').value = 'CdBd 모바일 명함';
    document.getElementById('variants').value = JSON.stringify([
      {slotId: "1:1269", imageHash: "2dde5a7f2e76e8db41f5e3568b1569e0e5905457", name: "안1_corporate_상단·서브"},
      {slotId: "1:1246", imageHash: "2dde5a7f2e76e8db41f5e3568b1569e0e5905457", name: "안2_corporate_하단·서브"},
      {slotId: "1:1269", imageHash: "f16b122b33a0868edc6902d79e7f12735b12312f", name: "안3_promotion_상단·서브"},
      {slotId: "1:1246", imageHash: "f16b122b33a0868edc6902d79e7f12735b12312f", name: "안4_promotion_하단·서브"}
    ], null, 2);
    document.getElementById('result').innerHTML = '<span class="ok">✅ A유형 예시 입력 완료. "4안 자동 제작 ▶" 클릭하세요.</span>';
  };

  // D 유형 검증 예시 — 3D 아이콘 (envelope, 1-3-2 §5.4 "초대장" 기능 매칭 1순위)
  // 폭 350px (3D 아이콘은 더 작아 텍스트 영역 넓음) → 한 줄 ~10-12자
  document.getElementById('fillExampleD').onclick = () => {
    // 1-1 §3: 의미 단위, 강조어 "7가지 이유" 한 줄 안에
    document.getElementById('title').value = '기업이 비공개 초대장을\\n고집하는 7가지 이유';
    document.getElementById('subtitle').value = 'B2B 행사·세미나 운영 가이드';
    document.getElementById('emphasis').value = '7가지 이유';
    document.getElementById('variants').value = JSON.stringify([
      {slotId: "1:1282", imageHash: "1d12e23b16a1a731f301472f653adb56c7761295", name: "안1_envelope_상단·서브"},
      {slotId: "1:1277", imageHash: "1d12e23b16a1a731f301472f653adb56c7761295", name: "안2_envelope_하단·서브"},
      {slotId: "1:1254", imageHash: "1d12e23b16a1a731f301472f653adb56c7761295", name: "안3_envelope_상단"},
      {slotId: "1:1274", imageHash: "1d12e23b16a1a731f301472f653adb56c7761295", name: "안4_envelope_하단"}
    ], null, 2);
    document.getElementById('result').innerHTML = '<span class="ok">✅ D유형 예시 입력 완료 (envelope = 초대장 기능 매칭 §5.4). "4안 자동 제작 ▶" 클릭하세요.</span>';
  };

  // E 유형 검증 예시 — 배경 (1-2-1 §1.2, §3.5: BG_SLOT opacity 20% + 텍스트 중앙)
  // 배경 이미지: 리스티클 주제 관련 / 보조 이미지: 선택 (envelope 예시)
  document.getElementById('fillExampleE').onclick = () => {
    document.getElementById('title').value = '마케터가 반드시\\n알아야 할\\nGEO 시대의\\n새로운 생존 전략';
    document.getElementById('subtitle').value = '';
    document.getElementById('emphasis').value = '새로운 생존 전략';
    document.getElementById('variants').value = JSON.stringify([
      {slotId: "1:1262", imageHash: "2dde5a7f2e76e8db41f5e3568b1569e0e5905457", name: "안1_배경·중앙", secondaryImageHash: "1d12e23b16a1a731f301472f653adb56c7761295"},
      {slotId: "1:1262", imageHash: "f16b122b33a0868edc6902d79e7f12735b12312f", name: "안2_배경·중앙_변형"}
    ], null, 2);
    document.getElementById('result').innerHTML = '<span class="ok">✅ E유형 예시 입력 완료 (배경·중앙 = 리스티클·추천). "4안 자동 제작 ▶" 클릭하세요.<br>※ secondaryImageHash: 보조 아이콘 (선택)</span>';
  };

  document.getElementById('run').onclick = () => {
    const title = document.getElementById('title').value.replace(/\\n/g, '\n');
    const subtitle = document.getElementById('subtitle').value.trim().replace(/\\n/g, '\n');
    const emphasis = document.getElementById('emphasis').value.trim();
    const variantsRaw = document.getElementById('variants').value.trim();
    if (!variantsRaw) {
      document.getElementById('result').innerHTML = '<span class="err">변형 매트릭스 JSON이 비어있습니다. "📋 검증 예시 자동 채우기" 버튼을 누르거나 직접 입력하세요.</span>';
      return;
    }
    let variants;
    try {
      variants = JSON.parse(variantsRaw);
    } catch (e) {
      document.getElementById('result').innerHTML = '<span class="err">변형 JSON 파싱 오류: ' + e.message + '</span>';
      return;
    }
    if (!title) {
      document.getElementById('result').innerHTML = '<span class="err">타이틀 필수</span>';
      return;
    }
    if (!Array.isArray(variants) || variants.length === 0) {
      document.getElementById('result').innerHTML = '<span class="err">변형 1개 이상 필요</span>';
      return;
    }

    document.getElementById('result').textContent = '제작 중…';
    parent.postMessage({ pluginMessage: {
      type: 'create-variants',
      payload: { title, subtitle, emphasis, variants }
    }}, '*');
  };

  window.onmessage = async (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'result') {
      if (msg.success) {
        const layoutInfo = window._cdbdLayoutInfo
          ? `<div style="margin-bottom:8px; padding:8px; background:#e6f7ff; border-radius:4px;">
              🎨 <b>선택된 유형: ${window._cdbdLayoutInfo.layoutType}</b><br>
              <span style="font-size:11px; color:#666;">이유: ${window._cdbdLayoutInfo.reason}</span>
            </div>`
          : '';
        document.getElementById('result').innerHTML =
          layoutInfo +
          '<span class="ok">✅ 완료!</span>\n' + JSON.stringify(msg.data, null, 2);
      } else {
        document.getElementById('result').innerHTML =
          '<span class="err">❌ ' + msg.error + '</span>';
      }
    } else if (msg.type === 'layout-selected') {
      // 레이아웃 유형 자동 선택 결과 저장
      window._cdbdLayoutInfo = {
        layoutType: msg.layoutType,
        reason: msg.reason,
        slotCount: msg.slotCount
      };
      document.getElementById('result').innerHTML =
        `<div style="padding:8px; background:#e6f7ff; border-radius:4px; margin-bottom:8px;">
          🎨 <b>자동 선택된 유형: ${msg.layoutType}</b><br>
          <span style="font-size:11px; color:#666;">이유: ${msg.reason}</span><br>
          <span style="font-size:11px; color:#666;">슬롯 수: ${msg.slotCount}개</span>
        </div>
        🎨 썸네일 제작 중…`;
    } else if (msg.type === 'search-openverse') {
      // 메인 배경 = Pollinations AI / 보조 3D 아이콘 = Thiings 다운로드
      const { keywords, count, decoration, blogTitle, blogContent } = msg;
      document.getElementById('result').innerHTML =
        `🎨 이미지 준비 중…<br><span style="font-size:11px;color:#666;">키워드: ${keywords.join(", ")}</span>`;

      // ════════════════════════════════════════════
      // Step 1: 보조 3D 아이콘 — Thiings에서 다운로드 (선택)
      // ════════════════════════════════════════════
      let thiingsIcon = null;
      if (decoration && decoration.thiings_url) {
        try {
          console.log(`[CdBd] Thiings 다운로드: ${decoration.slug} → ${decoration.thiings_url}`);
          document.getElementById('result').innerHTML =
            `📥 Thiings 3D 아이콘 다운로드 중… (${decoration.slug})`;

          const response = await fetch(decoration.thiings_url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const blob = await response.blob();
          const arrayBuffer = await blob.arrayBuffer();
          const bytes = Array.from(new Uint8Array(arrayBuffer));

          thiingsIcon = {
            success: true,
            bytes: bytes,
            name: `thiings_${decoration.slug}`,
            keyword: decoration.slug,
            isIcon: true
          };
          console.log(`[CdBd] ✅ Thiings 다운로드 완료: ${decoration.slug}`);
        } catch (e) {
          console.error(`[CdBd] Thiings 다운로드 실패:`, e.message);
        }
      } else if (decoration && decoration.figma_id) {
        console.log(`[CdBd] ⚠️ Thiings URL 없음 (${decoration.slug}). Figma 컴포넌트 ${decoration.figma_id} 사용 예정`);
      }

      // ════════════════════════════════════════════
      // Step 2: 메인 배경 이미지 — Pollinations AI 생성
      // ════════════════════════════════════════════
      const prompts = [];
      const mainKeyword = keywords[0];
      const subKeyword = keywords[1] || keywords[0];

      prompts.push({
        prompt: `${keywords.join(", ")}, modern, professional, marketing, clean background, cinematic`,
        keyword: mainKeyword,
        style: "main_bg"
      });
      prompts.push({
        prompt: `${subKeyword}, professional photography, business, minimalist, soft lighting`,
        keyword: subKeyword,
        style: "photo_bg"
      });
      if (keywords.length >= 2) {
        prompts.push({
          prompt: `${keywords[0]} and ${keywords[1]}, abstract gradient, modern, deep colors`,
          keyword: `${keywords[0]}_${keywords[1]}`,
          style: "abstract_bg"
        });
      }
      prompts.push({
        prompt: `${mainKeyword}, illustration, flat design, vibrant gradient`,
        keyword: mainKeyword,
        style: "illustration_bg"
      });

      const totalBg = Math.min(prompts.length, count);
      const selectedPrompts = prompts.slice(0, totalBg);
      console.log(`[CdBd] 생성할 배경 이미지: ${selectedPrompts.length}개 + Thiings 아이콘 ${thiingsIcon ? 1 : 0}개`);

      const imagesData = [];
      let successCount = 0;

      // Thiings 아이콘 먼저 추가 (있으면)
      if (thiingsIcon) {
        imagesData.push(thiingsIcon);
        successCount++;
      }

      // Pollinations 메인 배경 생성
      for (let i = 0; i < selectedPrompts.length; i++) {
        const p = selectedPrompts[i];
        try {
          const promptEncoded = encodeURIComponent(p.prompt);
          const seed = Math.floor(Math.random() * 100000) + i;
          const url = `https://image.pollinations.ai/prompt/${promptEncoded}?width=600&height=450&seed=${seed}`;

          console.log(`[CdBd] 배경 생성 ${i+1}/${selectedPrompts.length}: "${p.prompt.substring(0, 60)}..."`);
          document.getElementById('result').innerHTML =
            `🎨 AI 배경 생성 중… (${i + 1}/${selectedPrompts.length})<br>` +
            `<span style="font-size:11px;color:#666;">"${p.prompt.substring(0, 80)}..."</span>`;

          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const blob = await response.blob();
          const arrayBuffer = await blob.arrayBuffer();
          const bytes = Array.from(new Uint8Array(arrayBuffer));

          imagesData.push({
            success: true,
            bytes: bytes,
            name: `${p.style}_${p.keyword}`,
            keyword: p.keyword,
            isMain: true
          });
          successCount++;
        } catch (e) {
          console.error(`[CdBd] 배경 생성 실패:`, e.message);
          imagesData.push({
            success: false,
            error: e.message,
            name: `${p.style}_${p.keyword}`,
            isMain: true
          });
        }
      }

      if (successCount === 0) {
        document.getElementById('result').innerHTML =
          '<span class="err">❌ 이미지 생성 실패. 콘솔 확인 필요.</span>';
        return;
      }

      document.getElementById('result').innerHTML =
        `✅ 메인 ${successCount - (thiingsIcon ? 1 : 0)}개 + 아이콘 ${thiingsIcon ? 1 : 0}개 준비 완료. Figma에 업로드 중…`;

      // 결과를 plugin으로 전달
      parent.postMessage({
        pluginMessage: {
          type: 'images-fetched',
          payload: { blogTitle, blogContent, imagesData, decoration }
        }
      }, '*');
    } else if (msg.type === 'fetch-images') {
      // Plugin이 이미지 URL 리스트 전달 → UI가 fetch
      const { urls, blogTitle, blogContent } = msg;
      document.getElementById('result').textContent = `🌐 이미지 다운로드 중… (0/${urls.length})`;

      const imagesData = [];
      let successCount = 0;

      for (let i = 0; i < urls.length; i++) {
        const img = urls[i];
        let success = false;
        let lastError = '';

        // 1차 시도: 메인 URL (Lorem Flickr)
        try {
          console.log(`[CdBd] 다운로드 시도 ${i+1}: ${img.url}`);
          const response = await fetch(img.url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const blob = await response.blob();
          const arrayBuffer = await blob.arrayBuffer();
          const bytes = Array.from(new Uint8Array(arrayBuffer));

          imagesData.push({
            success: true,
            bytes: bytes,
            name: img.name,
            keyword: img.keyword
          });
          successCount++;
          success = true;
        } catch (e) {
          lastError = e.message;
          console.warn(`[CdBd] 1차 실패 (${img.name}):`, e.message);
        }

        // 2차 시도: Fallback URL (Picsum)
        if (!success && img.fallbackUrl) {
          try {
            console.log(`[CdBd] Fallback 시도 ${i+1}: ${img.fallbackUrl}`);
            const response = await fetch(img.fallbackUrl);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const blob = await response.blob();
            const arrayBuffer = await blob.arrayBuffer();
            const bytes = Array.from(new Uint8Array(arrayBuffer));

            imagesData.push({
              success: true,
              bytes: bytes,
              name: img.name + "_fallback",
              keyword: img.keyword
            });
            successCount++;
            success = true;
          } catch (e2) {
            lastError = `메인: ${lastError} / Fallback: ${e2.message}`;
            console.error(`[CdBd] Fallback도 실패 (${img.name}):`, e2.message);
          }
        }

        if (!success) {
          imagesData.push({
            success: false,
            error: lastError,
            name: img.name
          });
        }

        document.getElementById('result').textContent =
          `🌐 이미지 다운로드 중… (${i + 1}/${urls.length}, 성공: ${successCount})`;
      }

      document.getElementById('result').textContent =
        `📦 ${successCount}개 이미지 다운로드 완료. Figma에 업로드 중…`;

      // 결과를 plugin으로 다시 전달
      parent.postMessage({
        pluginMessage: {
          type: 'images-fetched',
          payload: { blogTitle, blogContent, imagesData }
        }
      }, '*');
    }
  };
</script>
</body>
</html>
